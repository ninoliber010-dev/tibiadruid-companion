[project]
name = "tibia-druid-companion"
version = "0.1.0"
description = "Read-only hunting companion for Elder Druids on the official Tibia Windows client"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.5"]

[project.gui-scripts]
tibia-druid-companion = "tdc.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdc*"]
